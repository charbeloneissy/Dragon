services:
  - type: web
    name: dragon-arbitrage-dex
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python dex_cross_exchange_runner.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: DEX_CHAIN_ID
        value: "8453"
      - key: DEX_STARTING_QUOTE
        value: "5"
      - key: DEX_QUOTE_TOKEN_DECIMALS
        value: "6"
      - key: DEX_MIN_NET_PROFIT
        value: "0.005"
      - key: DEX_SAFETY_BUFFER
        value: "0.001"
      - key: DEX_SLIPPAGE_BPS
        value: "50"
      - key: DEX_MAX_QUOTE_LATENCY_MS
        value: "1000"
      - key: DEX_POLL_SECONDS
        value: "0.5"
      - key: DEX_SOURCES
        value: "Uniswap_V3,Aerodrome"
      - key: LIVE_TRADING
        value: "false"
