services:
  - type: web
    name: dragon-arbitrage-dex
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python dragon_supervisor.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: DEX_CHAIN_ID
        value: "8453"
      - key: DEX_OWN_CAPITAL_QUOTE
        value: "0"
      - key: DEX_FLASH_LOAN_LIQUIDITY_QUOTE
        value: "1000"
      - key: DEX_QUOTE_TOKEN_DECIMALS
        value: "6"
      - key: DEX_MIN_NET_PROFIT
        value: "0.005"
      - key: DEX_SAFETY_BUFFER
        value: "0.001"
      - key: DEX_SLIPPAGE_BPS
        value: "50"
      - key: DEX_MAX_QUOTE_LATENCY_MS
        value: "1200"
      - key: DEX_POLL_SECONDS
        value: "2.0"
      - key: DEX_MAX_QUOTE_CANDIDATES
        value: "8"
      - key: DEX_MAX_BASE_TOKENS
        value: "5"
      - key: DEX_FAST_CANDIDATES
        value: "3"
      - key: DEX_FAST_PROBE_CONCURRENCY
        value: "2"
      - key: DEX_PAPER_BASE_TOKENS
        value: "0x4200000000000000000000000000000000000006,0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf,0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22,0x940181a94A35A4569E4529A3CDfB74e38FD98631,0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb"
      - key: DEX_OPTIMIZER_RADIUS
        value: "0.25"
      - key: DEX_OPTIMIZER_STEPS
        value: "4"
      - key: DEX_RPC_MAX_ATTEMPTS
        value: "3"
      - key: DEX_RPC_MAX_CONCURRENCY
        value: "6"
      - key: DEX_QUOTE_CONCURRENCY
        value: "2"
      - key: DEX_SELL_CONCURRENCY
        value: "2"
      - key: DEX_CANDIDATE_CONCURRENCY
        value: "2"
      - key: DEX_QUOTE_CACHE_SECONDS
        value: "0.25"
      - key: ZEROX_MAX_RPS
        value: "4"
      - key: ZEROX_SOURCES_CACHE_SECONDS
        value: "900"
      - key: DEX_0X_AGGREGATED
        value: "false"
      - key: DEX_0X_OPT_IN
        value: "false"
      - key: DEX_DISCOVERY_OPT_IN
        value: "false"
      - key: DEX_UNIVERSE_OPT_IN
        value: "false"
      - key: DEX_AUTO_DISCOVERY
        value: "false"
      - key: DEX_SOURCES
        value: "Uniswap_V3,Aerodrome"
      - key: DEX_COMPOUND_PROFITS
        value: "true"
      - key: DEX_COMPOUND_RATIO
        value: "1"
      - key: DEX_MAX_COMPOUND_QUOTE
        value: "100"
      - key: FLASH_LOAN_ENABLED
        value: "true"
      - key: FLASH_LOAN_FEE_BPS
        value: "0"
      - key: MEV_PROTECTION_REQUIRED
        value: "true"
      - key: ATOMIC_REPAYMENT_REQUIRED
        value: "true"
      - key: LIVE_TRADING
        value: "false"
      - key: DEX_LOCAL_ENGINE
        value: "false"
