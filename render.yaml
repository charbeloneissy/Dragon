services:
  - type: web
    name: dragon-arbitrage-dex
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # The scanner is the process; it serves its own health and dashboard port.
    startCommand: python dex_cross_exchange_runner.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      # Chains scanned every loop. Add more ids to fan out across venues.
      - key: DEX_CHAINS
        value: "1,42161,8453,10,56,137,43114"
      - key: NONEVM_CHAINS
        value: "tron,cosmos,solana"
      - key: JUPITER_QUOTE_URL
        value: "https://api.jup.ag/swap/v1/quote"
      # Leave RPCs blank to use the built-in public endpoints. A private RPC
      # (Alchemy/Infura/QuickNode) is strongly recommended for production.
      # Set ALCHEMY_API_KEY / INFURA_API_KEY / QUICKNODE_* on the service to
      # route every chain through the authenticated endpoint automatically.
      - key: ALCHEMY_API_KEY
        sync: false
      - key: INFURA_API_KEY
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: QUICKNODE_API_KEY
        sync: false
      - key: QUICKNODE_ENDPOINT
        sync: false
      - key: QUICKNODE_CHAIN_ID
        sync: false
      - key: DEX_RPC_URL
        value: ""
      - key: DEX_TAKER_ADDRESS
        value: "0x000000000000000000000000000000000000dEaD"
      - key: DEX_FLASH_LOAN_LIQUIDITY_QUOTE
        value: "100"
      - key: DEX_MIN_NET_PROFIT
        value: "0.005"
      - key: DEX_SAFETY_BUFFER
        value: "0.001"
      - key: DEX_SLIPPAGE_BPS
        value: "50"
      - key: DEX_POLL_SECONDS
        value: "4.0"
      - key: DEX_MAX_OPPORTUNITIES
        value: "8"
      - key: FLASH_LOAN_ENABLED
        value: "true"
      - key: FLASH_LOAN_FEE_BPS
        value: "5"
      - key: MEV_PROTECTION_REQUIRED
        value: "true"
      - key: DEX_COMPOUND_PROFITS
        value: "true"
      - key: DEX_COMPOUND_RATIO
        value: "1"
      - key: DEX_MAX_COMPOUND_QUOTE
        value: "100"
      - key: ATOMIC_REPAYMENT_REQUIRED
        value: "true"
      - key: LIVE_TRADING
        value: "false"
      - key: DRY_RUN
        value: "true"
