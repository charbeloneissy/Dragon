services:
  - type: web
    name: dragon-arbitrage-dex
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python dex_cross_exchange_runner.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: DEX_CHAIN_ID
        value: "8453"
      - key: DEX_OWN_CAPITAL_QUOTE
        value: "0"
      - key: DEX_FLASH_LOAN_LIQUIDITY_QUOTE
        value: "100"
      - key: DEX_QUOTE_TOKEN_DECIMALS
        value: "6"
      - key: DEX_MIN_NET_PROFIT
        value: "0.005"
      - key: DEX_SAFETY_BUFFER
        value: "0.001"
      - key: DEX_SLIPPAGE_BPS
        value: "50"
      - key: DEX_MAX_QUOTE_LATENCY_MS
        value: "1000"
      - key: DEX_POLL_SECONDS
        value: "1.0"
      - key: DEX_MAX_QUOTE_CANDIDATES
        value: "8"
      - key: DEX_OPTIMIZER_RADIUS
        value: "0.25"
      - key: DEX_OPTIMIZER_STEPS
        value: "4"
      - key: DEX_RPC_MAX_ATTEMPTS
        value: "4"
      - key: DEX_RPC_MAX_CONCURRENCY
        value: "2"
      - key: DEX_QUOTE_CACHE_SECONDS
        value: "0.25"
      - key: ZEROX_MAX_RPS
        value: "4"
      - key: ZEROX_SOURCES_CACHE_SECONDS
        value: "900"
      - key: DEX_0X_AGGREGATED
        value: "true"
      - key: DEX_SOURCES
        value: "Uniswap_V3,Aerodrome,0x:AGGREGATED"
      - key: FLASH_LOAN_ENABLED
        value: "true"
      - key: FLASH_LOAN_FEE_BPS
        value: "0"
      - key: MEV_PROTECTION_REQUIRED
        value: "true"
      - key: ATOMIC_REPAYMENT_REQUIRED
        value: "true"
      - key: LIVE_TRADING
        value: "false"
