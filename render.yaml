services:
  - type: web
    name: dragon-arbitrage-live
    runtime: python
    region: frankfurt
    plan: free
    branch: cross-exchange-futures-v1
    buildCommand: pip install -r requirements.txt
    startCommand: python dragon_cross_exchange_runner.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: DRAGON_CONFIG_PATH
        value: dragon_live_config.yaml
      - key: FUTURES_ONLY
        value: "true"
      - key: SPOT_ENABLED
        value: "false"
      - key: TRIANGULAR_ENABLED
        value: "false"
      - key: LIVE_TRADING
        value: "false"
