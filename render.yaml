services:
  - type: web
    name: dragon-arbitrage-dex
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: python -m pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: python dex_cross_exchange_runner.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: DEX_CHAINS
        value: "1,56,43114,8453,42161,10,137,130,324,7777777,480,42220,59144,534352,81457,5000"
      - key: NONEVM_CHAINS
        value: "solana"
      - key: JUPITER_QUOTE_URL
        value: "https://api.jup.ag/swap/v1/quote"
      - key: ALCHEMY_API_KEY
        sync: false
      - key: INFURA_API_KEY
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: QUICKNODE_API_KEY
        sync: false
      - key: QUICKNODE_ENDPOINT
        sync: false
      - key: QUICKNODE_CHAIN_ID
        sync: false
      - key: DEX_RPC_URL
        value: ""
      - key: DEX_TAKER_ADDRESS
        value: "0x000000000000000000000000000000000000dEaD"
      - key: DEX_FLASH_LOAN_LIQUIDITY_QUOTE
        value: "10000"
      - key: DEX_MIN_NET_PROFIT
        value: "0.005"
      - key: DEX_SAFETY_BUFFER
        value: "0"
      - key: DEX_GAS_ESTIMATE_MULTIPLIER
        value: "1.05"
      - key: DEX_SLIPPAGE_BPS
        value: "50"
      - key: DEX_POLL_SECONDS
        value: "4.0"
      - key: FREE_RENDER_HEALTH_PING_MINUTES
        value: "5"
      - key: AMPLITUDE_ENABLED
        value: "true"
      - key: AMPLITUDE_API_KEY
        sync: false
      - key: AMPLITUDE_ENDPOINT
        value: "https://api2.amplitude.com/2/httpapi"
      - key: DEX_MAX_OPPORTUNITIES
        value: "8"
      - key: FLASH_LOAN_ENABLED
        value: "true"
      - key: FLASH_LOAN_FEE_BPS
        value: "5"
      - key: MEV_PROTECTION_REQUIRED
        value: "true"
      - key: DEX_COMPOUND_PROFITS
        value: "true"
      - key: DEX_COMPOUND_RATIO
        value: "1"
      - key: DEX_MAX_COMPOUND_QUOTE
        value: "0"
      - key: ATOMIC_REPAYMENT_REQUIRED
        value: "true"
      - key: LIVE_TRADING
        value: "false"
      - key: DRY_RUN
        value: "true"
