mode: paper

strategy:
  type: cross_dex
  triangular: false
  intra_exchange: false

market:
  type: dex_spot
  spot: true
  futures: false
  perpetuals: false
  leverage: 1

capital:
  starting_balance_usdt: 5.0

arbitrage:
  min_net_profit_usdt: 0.005
  include_trading_fees: true
  include_gas_cost: true
  include_slippage: true
  max_quote_age_ms: 1000
  max_pair_skew_ms: 500

position:
  sizing: minimum_valid_lot
  dynamic_sizing: true
  compound_realized_pnl: true

execution:
  continuous_scanning: true
  continuous_trading: true
  order_type: market
  leg_timeout_ms: 1500
  hedge_on_partial_fill: false
  live_execution: false

runtime:
  poll_interval_ms: 500
  max_concurrent_pairs: 64
  log_level: INFO
