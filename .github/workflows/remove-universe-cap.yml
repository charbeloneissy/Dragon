name: Remove legacy 500-symbol cap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Remove legacy 500-symbol universe cap' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove cap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web_runner.py')
          s = p.read_text()
          old = '''        if len(symbols) * 2 > 1000:\n            symbols = symbols[:500]\n            allowed = set(symbols)\n            triangles = [t for t in triangles if all(s in allowed for s in t.symbols)]\n'''
          if old not in s:
              raise SystemExit('legacy 500-symbol cap not found')
          s = s.replace(old, '        # No arbitrary symbol cap. Full-universe runner handles WebSocket sharding.\n', 1)
          p.write_text(s)
          PY
          rm .github/workflows/remove-universe-cap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web_runner.py .github/workflows/remove-universe-cap.yml
          git commit -m 'Remove legacy 500-symbol universe cap'
          git push
