name: cross-exchange-tests

on:
  pull_request:
    paths:
      - "src/dragon/dex_cross_exchange.py"
      - "src/dragon/dex_0x.py"
      - "src/dragon/flash_executor.py"
      - "dex_cross_exchange_runner.py"
      - "contracts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/cross-exchange-tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile active DEX runtime
        run: python -m py_compile dex_cross_exchange_runner.py src/dragon/dex_cross_exchange.py src/dragon/dex_0x.py src/dragon/flash_executor.py
      - name: Run full test suite
        run: pytest -q
