name: cross-exchange-tests

on:
  pull_request:
    paths:
      - "src/dragon/cross_exchange_futures.py"
      - "tests/test_cross_exchange_futures.py"
      - "requirements.txt"
      - "dragon_live_config.yaml"
      - ".github/workflows/cross-exchange-tests.yml"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_cross_exchange_futures.py
